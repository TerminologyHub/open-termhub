buildscript {
  ext {
    springBootVersion = "4.1.1"
    log4jVersion = "2.26.1"
    tomcatEmbedVersion = "11.0.25"
    // Jackson 2 (legacy; still pulled by swagger/HAPI) and Jackson 3 (Boot 4 default)
    jackson2Version = "2.21.7"
    jackson3Version = "3.1.7"
    // org.hl7.fhir.* core libraries (fhir_core_version in HAPI BOM)
    hapiFhirCoreVersion = "6.10.3"
    // Boot 4 / Spring 7 support (8.14 line published as 8.13.15-SNAPSHOT)
    hapiFhirVersion = "8.13.16-SNAPSHOT"
    luceneVersion = "9.12.3"
  }
  repositories {
    mavenLocal()
    mavenCentral()
    maven {
      name = "central-portal-snapshots"
      url = "https://central.sonatype.com/repository/maven-snapshots/"
      mavenContent { snapshotsOnly() }
    }
    maven { url "https://repo.spring.io/release" }
    maven { url "https://repo.spring.io/milestone" }
    maven { url "https://repo.spring.io/snapshot" }
    maven { url "https://plugins.gradle.org/m2/" }
    gradlePluginPortal()
  }

  dependencies {
    classpath "org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}"
  }
}

// This must be at the top of the file (only can be below buildscript)
plugins {
    id 'java'
    id 'eclipse'
    id 'war'
    id 'org.springframework.boot' version "${springBootVersion}"

    id 'io.spring.dependency-management' version '1.1.4'
    id 'com.github.hierynomus.license' version '0.16.1'
    id 'com.github.spotbugs' version '6.5.13'
    id 'jacoco'
    id 'checkstyle'
    id 'maven-publish'
}

repositories {
  mavenLocal()
  mavenCentral()
  maven {
    name = "central-portal-snapshots"
    url = "https://central.sonatype.com/repository/maven-snapshots/"
    mavenContent { snapshotsOnly() }
  }
  maven { url "https://repo.spring.io/release" }
  maven { url "https://repo.spring.io/milestone" }
  maven { url "https://repo.spring.io/snapshot" }
}

group = 'com.wci.open-termhub'
version = '1.3.3-202609'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations.all {
   exclude group: "org.springframework.boot", module: "spring-boot-starter-logging"
}

// Ensure Spring Boot's dependency management is explicitly configured
dependencyManagement {
    imports {
        mavenBom "io.opentelemetry:opentelemetry-bom:1.62.0"
    }
    dependencies {
        dependency('org.codehaus.plexus:plexus-utils:4.0.3')
        dependency('org.apache.commons:commons-lang3:3.21.0')
        dependency("org.apache.logging.log4j:log4j-api:${log4jVersion}")
        dependency("org.apache.logging.log4j:log4j-core:${log4jVersion}")
        dependency("org.apache.logging.log4j:log4j-slf4j2-impl:${log4jVersion}")
        dependency("org.apache.logging.log4j:log4j-jul:${log4jVersion}")
        dependency("org.apache.tomcat.embed:tomcat-embed-core:${tomcatEmbedVersion}")
        dependency("org.apache.tomcat.embed:tomcat-embed-el:${tomcatEmbedVersion}")
        dependency("org.apache.tomcat.embed:tomcat-embed-websocket:${tomcatEmbedVersion}")
        dependency("com.fasterxml.jackson.core:jackson-core:${jackson2Version}")
        dependency("com.fasterxml.jackson.core:jackson-databind:${jackson2Version}")
        dependency("tools.jackson.core:jackson-core:${jackson3Version}")
        dependency("tools.jackson.core:jackson-databind:${jackson3Version}")
        dependency('org.apache.httpcomponents.core5:httpcore5:5.4.3')
        dependency('org.apache.httpcomponents.core5:httpcore5-h2:5.4.3')
        dependency('org.apache.httpcomponents.core5:httpcore5-reactive:5.4.3')
    }
}

// Configure Spring Boot to use Application as the main class
springBoot {
    mainClass = 'com.wci.termhub.Application'
}

dependencies {
  // NOTE: "spring-boot-starter-web" must be the first dependency
  implementation "org.springframework.boot:spring-boot-starter-web"
  implementation "org.springframework.boot:spring-boot-starter-actuator"
  implementation "org.springframework.boot:spring-boot-starter-log4j2"
  implementation "org.springframework.boot:spring-boot-starter-cache"
  implementation "org.springframework.boot:spring-boot-jackson"
  implementation "org.springframework.boot:spring-boot-restclient"
  implementation "org.springframework.boot:spring-boot-webmvc"

  implementation "org.thymeleaf:thymeleaf:3.1.5.RELEASE"
  implementation "org.thymeleaf:thymeleaf-spring6:3.1.5.RELEASE"

  implementation "org.fhir:ucum:1.0.9"
  // FHIR core libraries — version must match HAPI BOM fhir_core_version
  implementation "ca.uhn.hapi.fhir:org.hl7.fhir.convertors:${hapiFhirCoreVersion}"
  implementation "ca.uhn.hapi.fhir:org.hl7.fhir.dstu2:${hapiFhirCoreVersion}"
  implementation "ca.uhn.hapi.fhir:org.hl7.fhir.dstu2016may:${hapiFhirCoreVersion}"
  implementation "ca.uhn.hapi.fhir:org.hl7.fhir.dstu3:${hapiFhirCoreVersion}"
  implementation "ca.uhn.hapi.fhir:org.hl7.fhir.r4:${hapiFhirCoreVersion}"
  implementation "ca.uhn.hapi.fhir:org.hl7.fhir.r4b:${hapiFhirCoreVersion}"
  implementation "ca.uhn.hapi.fhir:org.hl7.fhir.r5:${hapiFhirCoreVersion}"
  implementation "ca.uhn.hapi.fhir:org.hl7.fhir.utilities:${hapiFhirCoreVersion}"
  implementation "ca.uhn.hapi.fhir:org.hl7.fhir.validation:${hapiFhirCoreVersion}"

  // prometheus
  implementation "io.micrometer:micrometer-registry-prometheus"

  // Add ANTLR runtime dependency to match code generation version
  implementation 'org.antlr:antlr4-runtime:4.13.2'

  // Annotation-only usage for Lucene field mapping
  implementation 'org.springframework.data:spring-data-elasticsearch'
  implementation "org.apache.lucene:lucene-core:${luceneVersion}"
  implementation "org.apache.lucene:lucene-analysis-common:${luceneVersion}"
  implementation "org.apache.lucene:lucene-queryparser:${luceneVersion}"
  implementation "org.apache.lucene:lucene-join:${luceneVersion}"
  implementation "org.apache.lucene:lucene-queries:${luceneVersion}"

  // REST
  implementation 'jakarta.ws.rs:jakarta.ws.rs-api:4.0.0'
  // Model classes still use JPA annotations (no JPA runtime)
  implementation 'jakarta.persistence:jakarta.persistence-api:3.2.0'
  // Syndication Atom/XML parsing (was transitive via removed HAPI JPA stack)
  implementation 'jakarta.xml.bind:jakarta.xml.bind-api'
  implementation 'org.glassfish.jaxb:jaxb-runtime'

  // OpenAPI/Swagger UI — springdoc 3.x for Spring Boot 4
  implementation ("org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3") {
    exclude group: "org.slf4j", module: "slf4j-simple"
    exclude group: "org.slf4j", module: "slf4j-api"
  }

  implementation 'org.apache.commons:commons-text:1.12.0'
  implementation 'org.apache.commons:commons-math3:3.6.1'
  implementation 'org.springframework.boot:spring-boot-starter-aspectj'

  implementation 'org.reflections:reflections:0.10.2'
  implementation ('com.google.guava:guava:33.4.8-jre') {
	  attributes{
	    attribute(Attribute.of('org.gradle.jvm.environment', String),'standard-jvm')
	  }
  }


  // FHIR libraries
  implementation ("ca.uhn.hapi.fhir:hapi-fhir-base:${hapiFhirVersion}") {
     exclude group: "com.google.guava", module: "guava"
  }
  implementation ("ca.uhn.hapi.fhir:hapi-fhir-structures-r4:${hapiFhirVersion}") {
     exclude group: "com.google.guava", module: "guava"
  }
  implementation ("ca.uhn.hapi.fhir:hapi-fhir-structures-r5:${hapiFhirVersion}") {
     exclude group: "com.google.guava", module: "guava"
  }
  implementation ("ca.uhn.hapi.fhir:hapi-fhir-server:${hapiFhirVersion}") {
     exclude group: "com.google.guava", module: "guava"
  }
  implementation ("ca.uhn.hapi.fhir:hapi-fhir-server-openapi:${hapiFhirVersion}") {
     exclude group: "com.google.guava", module: "guava"
     exclude group: "org.springdoc", module: "springdoc-openapi-starter-webmvc-ui"
     exclude group: "org.webjars", module: "swagger-ui"
  }
  implementation ("ca.uhn.hapi.fhir:hapi-fhir-structures-dstu2:${hapiFhirVersion}") {
     exclude group: "com.google.guava", module: "guava"
  }
  implementation ("ca.uhn.hapi.fhir:hapi-fhir-validation:${hapiFhirVersion}") {
     exclude group: "com.google.guava", module: "guava"
  }

  // For Test
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'org.springframework.boot:spring-boot-resttestclient'
  testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
  testImplementation 'org.junit.platform:junit-platform-suite-api'
  testImplementation 'org.junit.platform:junit-platform-suite-engine'
}

// ./gradlew clean test
test {
    useJUnitPlatform()
    exclude '**/integrationtest/**'
    maxParallelForks = 1
    testLogging {
        events "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = true
        showCauses = true
        showExceptions = true
        showStackTraces = true
    }
}

// Mockito inline mock maker on JDK 21+; avoids dynamic Java-agent WARNINGs in test stderr
tasks.withType(Test).configureEach {
    jvmArgs '-XX:+EnableDynamicAgentLoading'
}

// ./gradlew clean testR4
task testR4(type: Test) {
    useJUnitPlatform()
    include '**/r4/**'
    testLogging {
        events "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = true
        showCauses = true
        showExceptions = true
        showStackTraces = true
    }
}

// ./gradlew clean testR5
task testR5(type: Test) {
    useJUnitPlatform()
    include '**/r5/**'
    testLogging {
        events "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = true
        showCauses = true
        showExceptions = true
        showStackTraces = true
    }
}

// use "gradle licenseFormatMain/Test" to automatically generate headers
license {
  header = rootProject.file("config/LICENSE")
  strictCheck true
  encoding = "UTF-8"
  mapping("java", "SLASHSTAR_STYLE")
  includes(["**/*.java"])
  excludes(["**/*.txt", "**/*.conf", "**/*package-info.java", "**/*.properties"])
  ext.year = Calendar.getInstance().get(Calendar.YEAR)
  ext.company = "West Coast Informatics"
}
licenseTest.dependsOn licenseFormatTest
licenseMain.dependsOn licenseFormatMain

// SpotBugs https://spotbugs.readthedocs.io/en/latest/gradle.html
// https://github.com/spotbugs/spotbugs-gradle-plugin
spotbugs {
  ignoreFailures = false
  showStackTraces = true
  showProgress = true
  excludeFilter = file("${rootDir}/config/spotbugs/excludeFilter.xml")
}
spotbugsMain {
    reports {
        html {
            required = true
            outputLocation = layout.buildDirectory.file("reports/spotbugs/main/spotbugs.html")
            stylesheet = 'fancy-hist.xsl'
        }
    }
}
spotbugsTest {
    reports {
        html {
            required = true
            outputLocation = layout.buildDirectory.file("reports/spotbugs/main/spotbugs.html")
            stylesheet = 'fancy-hist.xsl'
        }
    }
}

// Checkstyle
checkstyle {
  toolVersion '10.25.0'
  ignoreFailures = true
  // Path to your Checkstyle configuration file
  configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
}
checkstyleMain {
  reports {
    html.outputLocation = layout.buildDirectory.file("reports/checkstyle.html")
  }
}
checkstyleTest {
  reports {
    html.outputLocation = layout.buildDirectory.file("reports/checkstyle.html")
  }
}

tasks.withType(JavaExec) {
  if (System.getProperty('DEBUG', 'false') == 'true') {
    jvmArgs '-Xdebug', '-Xrunjdwp:transport=dt_socket,server=y,suspend=y,address=5005'
  }
}

// Specify "export JAVA_OPTS=-Xmx8g" to set upper memory bound for upload
bootRun {
    jvmArgs '-XX:+UseCompactObjectHeaders'
    if (project.hasProperty('debug')) {
        jvmArgs = ["-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=5005", "-XX:+UseCompactObjectHeaders"]
    }
    // Check if the JAVA_OPTS environment variable is set and not empty
    if (System.getenv('JAVA_OPTS')) {
        // Use a simple loop to parse the arguments from the env variable
        def opts = System.getenv('JAVA_OPTS').split()
        for (arg in opts) {
            jvmArgs arg
        }
    }
    // args = ['--spring.profiles.active=your-profile']
}

// Avoid building the -plain war file
tasks.named('war') {
    enabled = false
}

bootJar {
  mainClass = 'com.wci.termhub.Application'
  manifest {
    attributes 'Main-Class': 'org.springframework.boot.loader.launch.PropertiesLauncher'
  }
}

jacoco {
  toolVersion = "0.8.13"
}

jacocoTestReport {
  dependsOn test

  reports {
    html {
      required = true
      outputLocation = layout.buildDirectory.dir("reports/jacoco")
    }
    xml {
      required = true
      outputLocation = layout.buildDirectory.file("reports/jacoco/report.xml")
    }
    csv.required = false
  }
}

jacocoTestCoverageVerification {
  violationRules {
    rule {
      element = 'CLASS'
      limit {
        counter = 'LINE'
        value = 'COVEREDRATIO'
        minimum = 0.60
      }
      excludes = [
        'com.wci.termhub.Application',
        'com.wci.termhub.config.*',
        'com.wci.termhub.model.*'
      ]
    }
  }
}

// To enact - ./gradlew dependencies --write-locks
dependencyLocking {
    lockAllConfigurations() // Lock all configurations by default
}
