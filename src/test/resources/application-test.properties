lucene.index.directory=build/index/lucene-index

# Literal (not ${READ_ONLY:...}) so tests do not inherit host READ_ONLY
read.only=false

# Terminology Syndication from TermHub
syndication.url=${TERMHUB_URL:https://dev.terminologyhub.com}
syndication.token=${PROJECT_API_KEY:}

server.mode=default

# Literal so tests do not inherit host FHIR_R4_CONTEXT_PATH / FHIR_R5_CONTEXT_PATH
fhir.r4.context.path=/fhir/r4
fhir.r5.context.path=/fhir/r5
